kind = "web"
previewPath = "/"
title = "Assistente de Voz para ERP"
description = "Prova de conceito de um assistente em português para consultar três métricas de ERP Sankhya por texto ou áudio, com números calculados por funções SQL governadas e detalhes auditáveis."
version = "1.0.0"
id = "artifacts/erp-voice-assistant"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 19304

[services.development]
run = "pnpm --filter @workspace/erp-voice-assistant run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/erp-voice-assistant", "run", "build" ]
serve = "static"
publicDir = "artifacts/erp-voice-assistant/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "19304"
BASE_PATH = "/"
