# Activate ONLY after a trusted certificate has been issued.
server {
    listen 80;
    server_name 187.77.232.164;
    location ^~ /.well-known/acme-challenge/ {
        root /tato/acme-webroot;
        default_type text/plain;
        try_files $uri =404;
    }
    location / { return 308 https://187.77.232.164$request_uri; }
}

server {
    # Browsers omit SNI for literal IPs. Be the TLS fallback while keeping
    # every existing named virtual host available through its own SNI.
    listen 443 ssl default_server;
    server_name 187.77.232.164;
    ssl_certificate /etc/letsencrypt-tato/live/tato-ip/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt-tato/live/tato-ip/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_tickets off;
    root /tato/web;
    client_max_body_size 16m;

    location = /tato { return 302 /tato/; }
    location /tato/api/ {
        rewrite ^/tato/(.*)$ /$1 break;
        proxy_pass http://127.0.0.1:5004;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_cookie_path / /tato/;
        proxy_read_timeout 360s;
        proxy_buffering off;
    }
    location /tato/assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
    location /tato/ {
        try_files $uri $uri/ /tato/index.html;
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options nosniff;
        add_header Referrer-Policy same-origin;
    }
    location / { return 404; }
}
