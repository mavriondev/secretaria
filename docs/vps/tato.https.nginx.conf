# Hashed assets of Tato (/tato/assets/): immutable caching only for responses with the right Content-Type.
# Key is "<uri>|<content-type>"; anything else (e.g. a .mjs served as application/octet-stream) gets no Cache-Control.
map "$uri|$sent_http_content_type" $tato_assets_cache {
    default "";
    "~\.(m?js)\|(text|application)/javascript$"    "public, max-age=31536000, immutable";
    "~\.wasm\|application/wasm$"                    "public, max-age=31536000, immutable";
    "~\.css\|text/css$"                             "public, max-age=31536000, immutable";
    "~\.onnx\|application/octet-stream$"            "public, max-age=31536000, immutable";
    "~\.(png|svg|jpg|webp|woff2?|ttf)\|(image|font)/" "public, max-age=31536000, immutable";
}

# Activate ONLY after a trusted certificate has been issued.
server {
    listen 80;
    server_name 187.77.232.164;
    location ^~ /.well-known/acme-challenge/ {
        root /tato/acme-webroot;
        default_type text/plain;
        try_files $uri =404;
    }
    location / { return 308 https://187.77.232.164$request_uri; }
}

server {
    # Browsers omit SNI for literal IPs. Be the TLS fallback while keeping
    # every existing named virtual host available through its own SNI.
    listen 443 ssl default_server;
    server_name 187.77.232.164;
    ssl_certificate /etc/letsencrypt-tato/live/tato-ip/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt-tato/live/tato-ip/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_tickets off;
    root /tato/web;
    client_max_body_size 16m;

    # Compression, measured on 14/10/2026 before enabling: the main JS bundle went out uncompressed (1.1 MB -> 0.3 MB with gzip),
    # the on-device speech classifier runtime too (ort-wasm 14.2 MB -> 3.7 MB) and so did every API JSON answer.
    # The global nginx.conf only has "gzip on" (text/html); the types below are what Tato actually serves.
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/javascript application/javascript application/json application/manifest+json application/wasm application/octet-stream image/svg+xml;

    # Tato ships ES modules (.mjs) and WebAssembly for the on-device speech classifier.
    # The packaged mime.types has no entry for .mjs or .webmanifest; without these the
    # browser refuses the module ("not a valid JavaScript MIME type") and voice fails.
    include /etc/nginx/mime.types;
    types { text/javascript mjs; application/manifest+json webmanifest; }

    location = /tato { return 302 /tato/; }
    location /tato/api/ {
        rewrite ^/tato/(.*)$ /$1 break;
        proxy_pass http://127.0.0.1:5004;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_cookie_path / /tato/;
        proxy_read_timeout 360s;
        proxy_buffering off;
    }
    location /tato/assets/ {
        try_files $uri =404;
        # Long cache only when the file is served with the type the browser needs (see map tato_assets_cache above);
        # a wrongly typed response gets no Cache-Control, so no device keeps it for a year.
        add_header Cache-Control $tato_assets_cache;
    }
    location /tato/ {
        try_files $uri $uri/ /tato/index.html;
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options nosniff;
        add_header Referrer-Policy same-origin;
        # The app is never shown inside another site's frame (no clickjacking of the login or of the data screens).
        add_header X-Frame-Options DENY;
        add_header Content-Security-Policy "frame-ancestors 'none'";
    }
    location / { return 404; }
}
