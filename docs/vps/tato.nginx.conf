# Dedicated IP virtual host: existing domain virtual hosts are unchanged.
server {
    listen 80;
    server_name 187.77.232.164;
    root /tato/web;
    client_max_body_size 16m;

    # Bootstrap for IP-address certificates without stopping other sites.
    location ^~ /.well-known/acme-challenge/ {
        root /tato/acme-webroot;
        default_type text/plain;
        try_files $uri =404;
    }
    location = /tato { return 302 /tato/; }
    location /tato/api/ {
        rewrite ^/tato/(.*)$ /$1 break;
        proxy_pass http://127.0.0.1:5004;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_cookie_path / /tato/;
        proxy_read_timeout 360s;
        proxy_buffering off;
    }
    location /tato/assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
    location /tato/ {
        try_files $uri $uri/ /tato/index.html;
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options nosniff;
        add_header Referrer-Policy same-origin;
    }
    location / { return 404; }
}
