# Tato at its own domain, served at the root: https://www.oitato.com.br/ (login screen), API at /api/.
# File on the VPS: /etc/nginx/sites-available/tato-dominio, linked in sites-enabled. The IP host stays in `tato`
# (redirects to this domain and keeps /tato/api/ for the client job); the $tato_assets_cache map is defined there (http scope).
#
# Two stages, because Nginx refuses to start with a certificate file that does not exist yet:
#   1. Before the certificate: only the port-80 block (ACME challenge + redirect). The HTTPS blocks stay commented out.
#   2. After `tato-certbot certonly ... --cert-name tato-dominio` succeeds: uncomment the HTTPS blocks, `nginx -t`, reload,
#      together with the activation of a release built with BASE_PATH=/ (scripts/update-vps.py does that since 2026-10-14).

server {
    listen 80;
    server_name www.oitato.com.br oitato.com.br;
    location ^~ /.well-known/acme-challenge/ {
        root /tato/acme-webroot;
        default_type text/plain;
        try_files $uri =404;
    }
    location / { return 308 https://www.oitato.com.br$request_uri; }
}

