# Live domain configuration. The shared $tato_assets_cache map is in the IP host file `tato`.
# Canonical address chosen by the owner: https://www.oitato.com.br/ (no /tato/).
server {
    listen 80;
    server_name www.oitato.com.br oitato.com.br;
    # Redirects can carry the TV capability in their URL.
    access_log off;
    location ^~ /.well-known/acme-challenge/ {
        root /tato/acme-webroot;
        default_type text/plain;
        try_files $uri =404;
    }
    location / { return 308 https://www.oitato.com.br$request_uri; }
}

server {
    listen 443 ssl;
    server_name oitato.com.br;
    access_log off;
    ssl_certificate /etc/letsencrypt-tato/live/tato-dominio/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt-tato/live/tato-dominio/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_tickets off;
    add_header Strict-Transport-Security "max-age=604800" always;
    return 301 https://www.oitato.com.br$request_uri;
}

server {
    listen 443 ssl;
    server_name www.oitato.com.br;
    ssl_certificate /etc/letsencrypt-tato/live/tato-dominio/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt-tato/live/tato-dominio/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_tickets off;
    root /tato/web/tato;
    client_max_body_size 16m;

    # Short initial HSTS, no includeSubDomains or preload. See DOMINIO.md before increasing.
    add_header Strict-Transport-Security "max-age=604800" always;
    add_header X-Frame-Options DENY always;
    add_header Content-Security-Policy "frame-ancestors 'none'" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/javascript application/javascript application/json application/manifest+json application/wasm application/octet-stream image/svg+xml;
    include /etc/nginx/mime.types;
    types { text/javascript mjs; application/manifest+json webmanifest; }

    location ^~ /.well-known/acme-challenge/ {
        root /tato/acme-webroot;
        default_type text/plain;
        try_files $uri =404;
    }
    location /tato/ { rewrite ^/tato/(.*)$ /$1 permanent; }
    location = /tato { return 301 /; }
    location /api/ {
        proxy_hide_header Referrer-Policy;
        proxy_pass http://127.0.0.1:5004;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 360s;
        proxy_buffering off;
    }
    location /assets/ {
        try_files $uri =404;
        # Cache-Control in a location disables parent add_header inheritance in packaged Nginx.
        add_header Cache-Control $tato_assets_cache;
        add_header Strict-Transport-Security "max-age=604800" always;
        add_header X-Frame-Options DENY always;
        add_header Content-Security-Policy "frame-ancestors 'none'" always;
        add_header X-Content-Type-Options nosniff always;
    }
    # Keep the original location when serving the SPA: no redirect to /index.html,
    # which would lose these capability-specific headers and logging rules.
    location ^~ /painel/ {
        try_files /index.html =404;
        access_log off;
        error_log /dev/null;
        add_header Cache-Control "no-store" always;
        add_header Referrer-Policy no-referrer always;
        add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
        add_header Strict-Transport-Security "max-age=604800" always;
        add_header X-Frame-Options DENY always;
        add_header Content-Security-Policy "frame-ancestors 'none'" always;
        add_header X-Content-Type-Options nosniff always;
    }
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
        add_header Strict-Transport-Security "max-age=604800" always;
        add_header X-Frame-Options DENY always;
        add_header Content-Security-Policy "frame-ancestors 'none'" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;
    }
}
